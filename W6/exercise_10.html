<!DOCTYPE html>
<html>
<head>
<meta name="viewport" context="width=device-width, initial-scale=1">
<style>
    .image {
        border-radius: 100%;
        display: block;
        width: 100px;
        height: 100px;
    }
    .overlay {
        position: absolute;
        border-radius: 100%;
        top: 0;
        bottom: 0;
        left: 0;
        right: 0;
        height: 100px;
        width: 100px;
        opacity: 0;
        transition: .5s ease;
        background-color:lightblue;
    }
    .container {
        position: relative;
        width: 50%;
    }
    .container:hover .overlay {
        opacity: 1;
    }
    .text {
        color:white;
        font-size: 20px;
        position: absolute;
        top: 50%;
        left: 50%;
        -webkit-transform: translate(-50%, -50%);
        -ms-transform: translate(-50%, -50%);
        transform: translate(-50%, -50%);
        text-align: center;
    }
</style>
<div class="container">
    <img src="/Users/minnn/Desktop/Materials/otters.jpg" alt="Otter" class="image">
    <div class="overlay">
        <div class="text">Otter</div>
    </div>
</div>
</head>
</html>
