<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f5ef; color: #242424; font-family: Georgia, "Times New Roman", serif; }
    main { width: min(560px, calc(100% - 40px)); padding: 48px; text-align: center; background: white; box-shadow: 0 12px 35px rgba(0, 0, 0, .12); }
    h1 { margin-top: 0; color: #247226; }
    p { line-height: 1.6; }
    .home-button { display: inline-block; margin-top: 20px; padding: 13px 23px; background: #159316; color: white; font-family: Arial, sans-serif; font-weight: bold; text-decoration: none; }
    .home-button:hover, .home-button:focus-visible { background: #25211f; }
    .home-button:active { background: #c64232; }
  </style>
</head>
<body>
  <main>
    <h1>News</h1>
    <p>Welcome to the news page. New updates and announcements will appear here.</p>
    <a class="home-button" href="../exercise_08.html">← Back to Home</a>
