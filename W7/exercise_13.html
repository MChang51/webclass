<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Class Schedule</title>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background-color: #f4f4f4;
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            margin: 0 0 28px;
            text-align: center;
            font-size: 52px;
            font-weight: 400;
        }

        table {
            width: 760px;
            margin: 0 auto;
            border-collapse: collapse;
            table-layout: fixed;
            background-color: #d7d7d7;
        }

        th,
        td {
            height: 58px;
            padding: 8px 12px;
            border: 2px solid #ececec;
            box-sizing: border-box;
            text-align: center;
            vertical-align: middle;
        }

        thead th {
            height: 68px;
            color: white;
            background-color: #333333;
            font-size: 20px;
            font-weight: bold;
        }

        .time {
            width: 115px;
            background-color: #c7c7c7;
            font-weight: bold;
        }

        .breakfast {
            background-color: #dddddd;
        }

        .business {
            background-color: #c6d783;
            font-weight: bold;
            line-height: 1.35;
        }

        .physics {
            background-color: #e3aa78;
            font-weight: bold;
            line-height: 1.35;
        }

        .math {
            background-color: #b7c5d8;
            font-weight: bold;
            line-height: 1.35;
        }
    </style>
</head>
<body>
    <h1>Task2</h1>

    <table>
        <thead>
            <tr>
                <th scope="col" class="time">Time</th>
                <th scope="col">Mon</th>
                <th scope="col">Tue</th>
                <th scope="col">Wed</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row" class="time">7:30 AM</th>
                <td class="breakfast">Breakfast</td>
                <td class="breakfast">Breakfast</td>
                <td class="breakfast">Breakfast</td>
            </tr>
            <tr>
                <th scope="row" class="time">8:00 AM</th>
                <td rowspan="2" class="business">Business: Lecture<br>Bldg B, Rm 256</td>
                <td rowspan="3" class="physics">Physics: Lab<br>Bldg J, Rm 309</td>
                <td rowspan="3" class="business">Business: Lecture<br>Bldg B, Rm 256</td>
            </tr>
            <tr>
                <th scope="row" class="time">8:30 AM</th>
            </tr>
            <tr>
                <th scope="row" class="time">9:00 AM</th>
                <td rowspan="2" class="math">Applied Math<br>Bldg H, Rm 100</td>
            </tr>
            <tr>
                <th scope="row" class="time">9:30 AM</th>
                <td></td>
                <td rowspan="2" class="math">Applied Math<br>Bldg J, Rm 100</td>
            </tr>
            <tr>
                <th scope="row" class="time">10:00 AM</th>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <th scope="row" class="time">10:30 AM</th>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <th scope="row" class="time">11:00 AM</th>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <th scope="row" class="time">11:30 AM</th>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
