<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Class Schedule</title>
    <style>
        body {
            margin: 0;
            padding: 48px 32px 80px;
            background-color: #f7f7f7;
            font-family: Arial, Helvetica, sans-serif;
            color: #333333;
        }

        table {
            width: 80%;
            min-width: 700px;
            max-width: 1250px;
            margin: 0 auto;
            border-collapse: collapse;
            table-layout: fixed;
            font-size: 18px;
        }

        th,
        td {
            height: 60px;
            padding: 8px 12px;
            border: 2px solid #f2f2f2;
            box-sizing: border-box;
            text-align: center;
            vertical-align: middle;
        }

        thead th {
            height: 72px;
            color: white;
            background-color: #333333;
            font-size: 22px;
            font-weight: bold;
        }

        .time {
            width: 17%;
            font-weight: bold;
        }

        .breakfast {
            background-color: #dddddd;
            font-weight: bold;
        }

        .business {
            background-color: #c8d98d;
            font-weight: bold;
            line-height: 1.35;
        }

        .physics {
            background-color: #e5ad7d;
            font-weight: bold;
            line-height: 1.35;
        }

        .math {
            background-color: #bac8da;
            font-weight: bold;
            line-height: 1.35;
        }

        tbody tr:nth-child(odd) {
            background-color: #e4e4e4;
        }

        tbody tr:nth-child(even) {
            background-color: #f4f4f4;
        }

        tbody tr:last-child th,
        tbody tr:last-child td {
            border-bottom-color: #777777;
        }

        @media (max-width: 800px) {
            body {
                padding: 32px 16px 60px;
                overflow-x: auto;
            }

            h1 {
                margin-bottom: 48px;
                font-size: 60px;
            }

            table {
                width: 700px;
            }
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th scope="col" class="time">Time</th>
                <th scope="col">Mon</th>
                <th scope="col">Tue</th>
                <th scope="col">Wed</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th scope="row" class="time">7:30 AM</th>
                <td class="breakfast">Breakfast</td>
                <td class="breakfast">Breakfast</td>
                <td class="breakfast">Breakfast</td>
            </tr>
            <tr>
                <th scope="row" class="time">8:00 AM</th>
                <td rowspan="2" class="business">Business: Lecture<br>Bldg B, Rm 256</td>
                <td rowspan="3" class="physics">Physics: Lab<br>Bldg J, Rm 309</td>
                <td rowspan="2" class="business">Business: Lecture<br>Bldg B, Rm 256</td>
            </tr>
            <tr>
                <th scope="row" class="time">8:30 AM</th>
            </tr>
            <tr>
                <th scope="row" class="time">9:00 AM</th>
                <td rowspan="2" class="math">Applied Math<br>Bldg H, Rm 100</td>
                <td rowspan="2" class="math">Applied Math<br>Bldg H, Rm 100</td>
            </tr>
            <tr>
                <th scope="row" class="time">9:30 AM</th>
                <td></td>
            </tr>
            <tr>
                <th scope="row" class="time">10:00 AM</th>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <th scope="row" class="time">10:30 AM</th>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <th scope="row" class="time">11:00 AM</th>
                <td></td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <th scope="row" class="time">11:30 AM</th>
                <td></td>
                <td></td>
                <td></td>
            </tr>
        </tbody>
    </table>
</body>
</html>
